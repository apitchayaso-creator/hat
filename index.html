<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psru Smart and Safety</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Smart and Safety Helmet Detection System</h1>
  </header>

  <section class="main-grid">
    <div class="stat-box" onclick="showPopup('helmet')">
      <i class="fas fa-motorcycle icon"></i>
      Wearing helmet: <strong>192</strong> people
    </div>
    <div class="stat-box" onclick="showPopup('noHelmet')">
      <i class="fas fa-user-slash icon"></i>
      Without helmet: <strong>47</strong> people
    </div>
    <div class="stat-box" onclick="showPopup('plates')">
      <i class="fas fa-car icon"></i>
      Detected license plates: <strong>132</strong> plates
    </div>
    <div class="stat-box circle" onclick="showPopup('rate')">
      <span>Helmet Wearing Rate Today</span>
      <div class="progress">
        <div class="value">80%</div>
      </div>
    </div>
  </section>

  <section class="main-grid">
    <div class="chart-box">
      <h3>Daily Helmet Usage</h3>
      <canvas id="dailyChart"></canvas>
    </div>
    <div class="chart-box">
      <h3>Monthly Helmet Usage Trend</h3>
      <canvas id="monthlyChart"></canvas>
    </div>
    <div class="map-box">
      <h3>Camera Locations</h3>
      <div id="map"></div>
    </div>
  </section>

  <!-- Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <div id="popup-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
